<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Icône d'onglet. Next.js sert automatiquement `app/icon.svg` comme favicon.

    LE COMMENTAIRE VIT À L'INTÉRIEUR DE LA BALISE, et ce n'est pas cosmétique :
    placé AVANT `<svg>`, il empêche le détecteur de taille de Next 15 de
    reconnaître le format, et le build échoue sur « is not a valid image file ».

    POURQUOI SEULEMENT LE « S ». Le logo de Symbiose Paysage est un bandeau
    typographique de 280 sur 65 : à 16 pixels, le mot entier devient une bouillie
    de trois pixels de haut. On garde donc le « S » initial — le TRACÉ EXACT du
    logo, chemin extrait tel quel de `public/symbiose-paysage.svg`, ni redessiné
    ni approximé.

    Les couleurs sont celles de la charte : fond vert profond #304d32 (celui des
    lettres), lettre en vert clair #9db04f (celui de l'accent du « Y »). Le
    contraste mesuré entre les deux vaut 3,9 pour 1 — au-dessus du seuil de 3
    exigé pour un objet graphique, en dessous de celui d'un texte courant, ce qui
    convient à une lettre pleine de cette taille. Passer la lettre en blanc
    monterait à 9,4 si l'onglet devait se distinguer de plus loin.

    La tuile est PLEINE, comme celle de Duret : un onglet de navigateur a besoin
    d'une surface pour se détacher de ses voisins, un glyphe flottant sur du
    transparent disparaît sur les thèmes sombres.
  -->
  <rect width="64" height="64" rx="12" fill="#304d32"/>
